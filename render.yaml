services:
  # 1. Express + Socket.io + PeerJS Backend Service
  - type: web
    name: campusconnect-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://vxzbrmrnziaplrkbjhxc.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://campusconnect-frontend.onrender.com

  # 2. Vite React Frontend Static Site
  - type: web
    name: campusconnect-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK_DATA
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://campusconnect-backend.onrender.com/api
